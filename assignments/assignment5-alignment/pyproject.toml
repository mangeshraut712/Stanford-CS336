[project]
name = "alignment"
version = "1.0.0"
description = "CS 336 Spring 2026 Assignment 5: Reasoning RL"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # Python 3.13 not yet supported for some deps
dependencies = [
    "certifi>=2026.10.19",
    "accelerate>=1.5.2",
    "math-verify[antlr4-13-2]>=0.7.0",
    "modal>=1.1.0",
    "pytest>=8.3.5",
    "pylatexenc>=2.10",
    # 2.13 clears the torch.jit.script advisory. vLLM 0.30+ requires exactly 2.13.0.
    "torch>=2.13.0",
    "transformers>=5.10.4,<5.11",
    "typer>=0.15.4",
    "xopen>=2.0.2",
]

[project.optional-dependencies]
gpu = [
    "alpaca-eval>=0.6.6",
    "torch>=2.13.0",
    # 0.30 clears the open vLLM advisories and pins torch==2.13.0.
    # Wheels are published for Linux x86_64, not macOS.
    # flash-attn is not pinned: the old GitHub release wheel returns 401
    # through Dependabot's proxy, so `uv lock` cannot refresh this extra.
    "vllm>=0.30.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wandb>=0.26.0",
]
plots = [
    "wandb>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["cs336_alignment*"]

[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Floors for transitive high/critical advisories pulled in by the gpu extra.
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "fsspec>=2026.6.0",
    # vLLM 0.30+ requires mcp 2.x. The 1.28.1 security fixes landed before 2.0.
    "mcp>=2.0.0,<3",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.30",
    "sentencepiece>=0.2.1",
    "starlette>=1.3.1",
    # setuptools stays <81 on Linux. vLLM requires that cap because Triton
    # still imports pkg_resources, which setuptools 82 removed. The MANIFEST.in
    # advisory needs 83 and is deferred upstream.
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", extra = "gpu", marker = "sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
testpaths = ["tests"]
