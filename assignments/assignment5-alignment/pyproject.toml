[project]
name = "alignment"
version = "1.0.0"
description = "CS 336 Spring 2026 Assignment 5: Reasoning RL"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # Python 3.13 not yet supported for some deps
dependencies = [
    "accelerate>=1.5.2",
    "math-verify[antlr4-13-2]>=0.7.0",
    "modal>=1.1.0",
    "pytest>=8.3.5",
    "pylatexenc>=2.10",
    "torch",
    "transformers>=5.10.4,<5.11",
    "typer>=0.15.4",
    "xopen>=2.0.2",
]

[project.optional-dependencies]
gpu = [
    "alpaca-eval>=0.6.6",
    # Community cp312/cu12 wheel matched to Torch 2.11 (vLLM >=0.24).
    "flash-attn @ https://github.com/lesj0610/flash-attention/releases/download/v2.8.3-cu12-torch2.11/flash_attn-2.8.3%2Bcu12torch2.11cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch",
    # 0.24+ clears the open high/critical vLLM advisories. 0.27+ requires Torch 2.13.
    # Wheels and CUDA-only deps are published for Linux x86_64, not macOS.
    "vllm>=0.24.0,<0.27 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wandb>=0.26.0",
]
plots = [
    "wandb>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["cs336_alignment*"]

[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Floors for transitive high/critical advisories pulled in by the gpu extra.
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "fsspec>=2026.6.0",
    "mcp>=1.28.1,<2",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.30",
    "sentencepiece>=0.2.1",
    "starlette>=1.3.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", extra = "gpu", marker = "sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
testpaths = ["tests"]
